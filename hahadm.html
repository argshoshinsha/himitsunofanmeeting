    <script>
        const myMessage1 = "娘さんの捜索に協力したいです";
        
        const aiMessage1_1 = "メッセージ、読みました。……本当に、あの子を探す手伝いなんてしてくださるんですか？私は最初から、あの子が一人暮らしするなんて大反対でした。あんなに危険だから止めたのに、私の言うことなんて一切聞かなかった。毎朝・毎晩私に連絡を入れるのは「絶対の義務」にしていたんです。私がどれだけ厳しく、細かく管理してあの子の安全を守ってきたか……。それなのに、12月1日の朝の連絡を最後にパタリと途絶えました。嫌な予感がして合鍵で部屋に入ったら、もう本人はいなかったんです。部屋を見て、血の気が引きました。あの子の部屋が、見覚えのないアイドルのグッズで埋め尽くされていたんです。アイドルを好きになったなんて一言も……。部屋にあった手掛かりといえば、会員証に書かれた会員番号とパスワード、それと「秘密のファンミーティング」とかいう気味の悪いメモ……。一体あの子はどこにいるのでしょうか。私はこういうネットの面倒くさい仕組みとか、スマートフォンで何をやっているのかさっぱり分かりません。警察にも相談しましたけど、「成人しているから」の一点張りで、本当に使えない人たちです。\nあなた、インターネットが得意なんでしょう？あの子が今どこにいるのか、探して頂戴。\n分かったらどこなのか私にわかりやすく簡潔に教えて。";

        const chatArea = document.getElementById('chat-area');
        const inputBox = document.getElementById('input-box');
        const sendButton = document.getElementById('send-button');

        let step = 1;

        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        inputBox.value = myMessage1;
        updateButtonState();

        inputBox.addEventListener('input', updateButtonState);

        function updateButtonState() {
            if (inputBox.value.trim() === "") {
                sendButton.disabled = true;
            } else {
                sendButton.disabled = false;
            }
        }

        function appendMessage(text, side) {
            let html = '';

            if (side === 'right') {
                html = `
                    <div class="message-wrapper message-right">
                        <div class="bubble">${text}</div>
                    </div>
                `;
            } else {

                        <div class="bubble">${text}</div>
                    </div>
                `;
            }

            chatArea.insertAdjacentHTML('beforeend', html);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        sendButton.addEventListener('click', async () => {
            const text = inputBox.value.trim();
            if (text === "") return; 

            appendMessage(text, 'right');
            
            inputBox.value = "";
            inputBox.disabled = true;
            updateButtonState();

            if (step === 1) {
                step = 2;

                await wait(3000);
                appendMessage(aiMessage1_1, 'left'); 
                
                await wait(1500);
                appendMessage(aiMessage1_2, 'left'); 
                
                await wait(1500);
                appendMessage(aiMessage1_3, 'left'); 
                
                inputBox.placeholder = "メッセージを作成...";
                inputBox.disabled = false;
                updateButtonState();

            } else if (step === 2) {
                const isCorrect = correctAnswers.some(ans => text.includes(ans));
                
                if (isCorrect) {
                    step = 3; 
                    
                    await wait(1000);
                    appendMessage(aiMessage2_1, 'left');
                    
                    await wait(1500);
                    appendMessage(aiMessage2_2, 'left');
                    
                    inputBox.placeholder = "会話は終了しました";
                    
                } else {
                    inputBox.disabled = false;
                    updateButtonState();
                }
            } else {
                inputBox.disabled = false;
                updateButtonState();
            }
        });
