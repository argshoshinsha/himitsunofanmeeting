<div class="login-card">
        <h1 class="login-title">FANCLUB LOGIN</h1>
        <p class="login-subtitle">SEARCH LIGHT オフィシャルファンクラブ会員専用</p>

        <!-- エラーメッセージ表示エリア -->
        <div id="error-msg" class="error-message">会員番号またはパスワードが違います。</div>

        <form id="login-form">
            <div class="input-group">
                <label for="member-id">会員番号</label>
                <input type="text" id="member-id" placeholder="例: 123456" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" placeholder="半角英数字">
            </div>

            <button type="submit" class="login-btn">ログイン</button>
        </form>

        <div class="sub-links">
            <!-- 押せないリンク（pointer-events: none; を設定済み） -->
            <a href="#" class="forgot-pass">パスワードを忘れた方はこちら</a>

            <!-- 押せないボタン（disabled 属性を設定済み） -->
            <button type="button" class="register-btn" disabled>新規会員登録はこちら</button>
        </div>
    </div>

    <!-- フッターエリア -->
    <footer>
        <p>このサイトはフィクションです</p>
        <p class="copyright">&copy; 初心者 / 秘密のファンミーティング</p>
    
      <p class="yacho-powered-by" style="margin-top:8px;font-size:11px;opacity:.55;">Powered by <a href="https://sim3.net/yacho/" target="_blank" rel="noopener">YACHO(SIM3)</a></p>
    </footer>

    <!-- ここからJavaScript（ログインの判定処理） -->
    <script>
        // ==========================================
        // ▼▼▼ 設定エリア（ここを書き換えてください） ▼▼₂
        // ==========================================
        
        // 正しい会員番号を設定
        const CORRECT_ID = "016936"; 
        
        // 正しいパスワードを設定
        const CORRECT_PASS = "ailovekai"; 
        
        // ログイン成功時に飛ばしたいサイトのURLを設定
        const REDIRECT_URL = "fantop.html"; 

        // ==========================================

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        // ログインボタンが押された時の処理
        loginForm.addEventListener('submit', function(event) {
            // フォームの標準動作（ページ更新）をストップ
            event.preventDefault();

            // 入力された値を取得
            const inputId = document.getElementById('member-id').value;
            const inputPass = document.getElementById('password').value;

            // 入力値と設定した値が一致するかチェック
            if (inputId === CORRECT_ID && inputPass === CORRECT_PASS) {
                // 一致した場合：エラーメッセージを消して、指定URLへ移動
                errorMsg.style.display = 'none';
                window.location.href = REDIRECT_URL;
            } else {
                // 一致しなかった場合：エラーメッセージを表示
                errorMsg.style.display = 'block';
            }
        });
    </script>
