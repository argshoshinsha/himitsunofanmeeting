<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第4問</title>
    
    <!-- ▼▼▼ ここからデザイン(CSS) ▼▼▼ -->
    <style>
        /* ページ全体の基本設定（黒背景・青文字・等幅フォント） */
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Courier New', Consolas, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* ポップアップアニメーションのスクロールバー防止 */
        }

        /* 中央のコンテンツを囲む枠 */
        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border: 1px solid #1e90ff;
            box-shadow: 0 0 15px rgba(30, 144, 255, 0.3);
            background-color: #000000;
        }

        /* タイトルのデザイン */
        .title {
            font-size: 1.5rem;
            color: #ffffff;
            border-bottom: 1px dashed #1e90ff;
            padding-bottom: 10px;
            margin-top: 0;
            text-shadow: 0 0 8px #1e90ff;
        }

        /* コメント（状況説明）のデザイン */
        .comment {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #cccccc;
        }

        /* 問題文を囲む箱 */
        .question-box {
            background-color: rgba(30, 144, 255, 0.1);
            padding: 20px;
            margin-bottom: 30px;
            border-left: 5px solid #1e90ff;
        }

        .question {
            font-size: 1.2rem;
            margin: 0;
            font-weight: bold;
            color: #ffffff;
        }

        /* 入力欄とボタンのエリア */
        .answer-area {
            display: flex;
            gap: 10px;
        }

        /* 入力欄（テキストボックス）のデザイン */
        input[type="text"] {
            flex-grow: 1;
            background-color: #000;
            color: #1e90ff;
            border: 1px solid #1e90ff;
            padding: 10px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(30, 144, 255, 0.6);
        }

        /* 送信ボタンのデザイン */
        button {
            background-color: #1e90ff;
            color: #ffffff;
            border: 1px solid #0000cd;
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #000;
            color: #1e90ff;
            box-shadow: 0 0 10px #1e90ff;
        }

        /* エラーメッセージ（不正解の時の文字） */
        .error {
            margin-top: 15px;
            min-height: 1.5em;
            font-weight: bold;
        }

        /* ＝＝＝ ここからポップアップ用のデザイン追加 ＝＝＝ */
        .popup-container {
            position: fixed;
            bottom: -150px; /* 最初は画面の下に隠しておく */
            right: 20px; /* 画面右下 */
            background-color: #000;
            border: 1px solid #ff4444; /* 緊急らしさを出すために赤系 */
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: bottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* バウンドするようなアニメーション */
            z-index: 1000;
        }
        
        /* JSでこのクラスが付与されると画面内にスライドインする */
        .popup-container.show {
            bottom: 20px; 
        }

        .popup-text {
            color: #ff4444;
            margin: 0;
            font-weight: bold;
            font-size: 0.95rem;
            text-align: center;
            animation: blink 1s infinite alternate; /* 文字を点滅させる */
        }

        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .popup-btn {
            background-color: #ff4444;
            color: #ffffff;
            border: 1px solid #cc0000;
            padding: 8px 15px;
            font-size: 0.85rem;
        }
        .popup-btn:hover {
            background-color: #000;
            color: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }
        /* ＝＝＝ ポップアップ用デザインここまで ＝＝＝ */

    </style>
    <!-- ▲▲▲ ここまでデザイン(CSS) ▲▲▲ -->

<body>

    <!-- ▼▼▼ ここから画面の表示内容(HTML) ▼▼▼ -->
    <div class="container">
        
        <!-- ▼ タイトル ▼ -->
        <h1 class="title">第4問</h1>

        <!-- ▼ コメント（状況説明やフレーバーテキスト） ▼ -->
        <div class="comment">
          <p>大正解！さすがだね雑誌もしっかりチェックしてくれてありがとう！</p>
          <p>僕の大切な思い出にちょっと近くて、共感することが多くて何度も読み返してるんだ。</p>
          <p>次は第4問だけどどう？ここまで簡単だった？それとも難しかった？</p>
          <p>全部で5問作ったからさ、僕との思い出を振り返るつもりで楽しんでやってくれてるといいな</p>
        </div>

        <!-- ▼ 問題文 ▼ -->
        <div class="question-box">
            <p class="question">
                第4問 僕が小さなころにした約束は？
            </p>
        </div>

        <!-- ▼ 解答入力エリア ▼ -->
        <div class="answer-area">
            <input type="text" id="answerInput" placeholder="Enter password...">
            <button onclick="checkAnswer()">送信</button>
        </div>
        <p id="errorMessage" class="error"></p>

    </div>

    <!-- ＝＝＝ ここからポップアップウィンドウ（緊急連絡） ＝＝＝ -->
    <div id="emergencyPopup" class="popup-container">
        <p class="popup-text">【メッセージ】<br>マネージャーより緊急連絡</p>
        <button class="popup-btn" onclick="openEmergencyLink()">詳細を確認する</button>
    </div>
    <!-- ＝＝＝ ポップアップウィンドウここまで ＝＝＝ -->

    <!-- ▲▲▲ ここまで画面の表示内容(HTML) ▲▲▲ -->


    <!-- ▼▼▼ ここから正誤判定の動き(JavaScript) ▼▼▼ -->
    <script>
        // --- 既存の解答チェック処理 ---
        function checkAnswer() {
            const correctAnswer = "結婚して一緒にマンションの最上階に住む"; 
            const nextPage = "questionlast.html"; 

            const input = document.getElementById("answerInput").value;
            const errorMsg = document.getElementById("errorMessage");

            if (input === correctAnswer) {
                errorMsg.style.color = "#1e90ff";
                errorMsg.innerText = "Check Answer... 転送中 ...";
                setTimeout(() => { window.location.href = nextPage; }, 1500);
            } else {
                errorMsg.style.color = "#ff0000";
                errorMsg.innerText = "Access Denied. 不正解";
            }
        }

        // ＝＝＝ ここからポップアップ用の処理追加 ＝＝＝
        
        // ページが読み込まれてから10秒（10000ミリ秒）後にポップアップを表示
        setTimeout(() => {
            document.getElementById("emergencyPopup").classList.add("show");
        }, 10000); 

        // ポップアップのボタンが押された時の処理
        function openEmergencyLink() {
            // 【変更】別窓で開きたいURLをここに設定してください
            const emergencyUrl = "mgmessage.html"; 
            
            // _blank を指定することで、新しいタブ（別窓）でリンクが開きます
            window.open(emergencyUrl, "_blank");
        }
    </script>
    <!-- ▲▲▲ ここまで正誤判定の動き(JavaScript) ▲▲▲ -->
