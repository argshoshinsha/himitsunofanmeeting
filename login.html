<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ファンクラブ ログイン画面</title>
    <style>
        /* --- 全体のリセットと基本設定 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            /* さわやかな青と白のグラデーション背景 */
            background: linear-gradient(135deg, #e0f7fa 0%, #bbdefb 100%);
            color: #333;
            display: flex;
            flex-direction: column;       /* 縦方向に並べる */
            justify-content: space-between; /* 上下（カードとフッター）にスペースを分ける */
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- ログインパネル（白いカード） --- */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 86, 179, 0.15);
            text-align: center;
            margin: auto; /* 上下中央に配置するための調整 */
        }

        /* タイトル・ロゴ風 */
        .login-title {
            color: #0277bd; /* さわやかな濃い青 */
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .login-subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 30px;
        }

        /* --- 入力フォーム --- */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #0277bd;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #b3e5fc;
            border-radius: 6px;
            font-size: 15px;
            background-color: #f9fdfd;
            transition: all 0.3s ease;
            outline: none;
        }
        /* 入力中（フォーカス時）の装飾 */
        .input-group input:focus {
            border-color: #039be5;
            box-shadow: 0 0 0 3px rgba(3, 155, 229, 0.2);
            background-color: #ffffff;
        }

        /* エラーメッセージ（初期は非表示） */
        .error-message {
            color: #d32f2f;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
            display: none; /* JavaScriptで制御 */
        }

        /* --- ログインボタン --- */
        .login-btn {
            width: 100%;
            background-color: #039be5;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 25px;
        }
        .login-btn:hover {
            background-color: #0277bd;
        }

        /* --- リンク・その他ボタンエリア --- */
        .sub-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-top: 1px solid #e1f5fe;
            padding-top: 25px;
        }

        /* パスワードを忘れた方（ダミーリンク） */
        .forgot-pass {
            color: #81d4fa;
            font-size: 13px;
            text-decoration: none;
            pointer-events: none; /* 押せなくするCSS */
        }

        /* 新規会員登録ボタン（ダミーボタン） */
        .register-btn {
            width: 100%;
            background-color: #f1f8ff;
            color: #a0c4de;
            border: 2px solid #e1f0fa;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
        }

        /* --- フッターのスタイル --- */
        footer {
            color: #557a95;
            text-align: center;
            font-size: 11px;
            margin-top: 20px;
        }
        footer p {
            margin: 2px 0;
        }

    </style>
<meta name="generator" content="simple-item-master-three">
</head>
<body>

    <div class="login-card">
        <h1 class="login-title">FANCLUB LOGIN</h1>
        <p class="login-subtitle">SEARCH LIGHT オフィシャルファンクラブ会員専用</p>

        <!-- エラーメッセージ表示エリア -->
        <div id="error-msg" class="error-message">会員番号またはパスワードが違います。</div>

        <form id="login-form">
            <div class="input-group">
                <label for="member-id">会員番号</label>
                <input type="text" id="member-id" placeholder="例: 123456" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" placeholder="半角英数字">
            </div>

            <button type="submit" class="login-btn">ログイン</button>
        </form>

        <div class="sub-links">
            <!-- 押せないリンク（pointer-events: none; を設定済み） -->
            <a href="#" class="forgot-pass">パスワードを忘れた方はこちら</a>

            <!-- 押せないボタン（disabled 属性を設定済み） -->
            <button type="button" class="register-btn" disabled>新規会員登録はこちら</button>
        </div>
    </div>

    <!-- フッターエリア -->
    <footer>
        <p>このサイトはフィクションです</p>
        <p class="copyright">&copy; 初心者 / 秘密のファンミーティング</p>
    
      <p class="yacho-powered-by" style="margin-top:8px;font-size:11px;opacity:.55;">Powered by <a href="https://sim3.net/yacho/" target="_blank" rel="noopener">YACHO(SIM3)</a></p>
    </footer>

    <!-- ここからJavaScript（ログインの判定処理） -->
    <script>
        // ==========================================
        // ▼▼▼ 設定エリア（ここを書き換えてください） ▼▼₂
        // ==========================================
        
        // 正しい会員番号を設定
        const CORRECT_ID = "016936"; 
        
        // 正しいパスワードを設定
        const CORRECT_PASS = "ailovekai"; 
        
        // ログイン成功時に飛ばしたいサイトのURLを設定
        const REDIRECT_URL = "fantop.html"; 

        // ==========================================

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        // ログインボタンが押された時の処理
        loginForm.addEventListener('submit', function(event) {
            // フォームの標準動作（ページ更新）をストップ
            event.preventDefault();

            // 入力された値を取得
            const inputId = document.getElementById('member-id').value;
            const inputPass = document.getElementById('password').value;

            // 入力値と設定した値が一致するかチェック
            if (inputId === CORRECT_ID && inputPass === CORRECT_PASS) {
                // 一致した場合：エラーメッセージを消して、指定URLへ移動
                errorMsg.style.display = 'none';
                window.location.href = REDIRECT_URL;
            } else {
                // 一致しなかった場合：エラーメッセージを表示
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
